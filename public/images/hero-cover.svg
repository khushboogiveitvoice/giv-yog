<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF7F2"/>
      <stop offset="0.55" stop-color="#F8EDE3"/>
      <stop offset="1" stop-color="#F3DCCB"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3D6" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#F6D9B0" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#F6D9B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE3DF"/>
      <stop offset="1" stop-color="#9FC8C4"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#D98F76"/>
      <stop offset="1" stop-color="#F6D3C6"/>
    </linearGradient>
    <filter id="paint" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  0 0 0 0.09 0"/>
    </filter>
    <g id="lotus">
      <g fill="url(#petal)" stroke="#C9A24D" stroke-width="1.2" stroke-opacity="0.8">
        <path d="M0 0 C-30 -20 -30 -70 0 -100 C30 -70 30 -20 0 0Z" transform="rotate(-64) scale(0.82)" opacity="0.8"/>
        <path d="M0 0 C-30 -20 -30 -70 0 -100 C30 -70 30 -20 0 0Z" transform="rotate(64) scale(0.82)" opacity="0.8"/>
        <path d="M0 0 C-30 -20 -30 -70 0 -100 C30 -70 30 -20 0 0Z" transform="rotate(-32) scale(0.95)" opacity="0.92"/>
        <path d="M0 0 C-30 -20 -30 -70 0 -100 C30 -70 30 -20 0 0Z" transform="rotate(32) scale(0.95)" opacity="0.92"/>
        <path d="M0 0 C-30 -20 -30 -70 0 -100 C30 -70 30 -20 0 0Z"/>
      </g>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun glow behind logo -->
  <circle cx="1170" cy="400" r="430" fill="url(#sun)"/>
  <g fill="none" stroke="#C9A24D" stroke-opacity="0.28">
    <circle cx="1170" cy="400" r="300" stroke-width="1.2"/>
    <circle cx="1170" cy="400" r="360" stroke-width="1" stroke-dasharray="2 10"/>
    <circle cx="1170" cy="400" r="420" stroke-width="0.8"/>
  </g>

  <!-- hills -->
  <g filter="url(#paint)">
    <path d="M0 640 C220 560 380 600 560 560 C760 515 900 590 1100 545 C1300 500 1450 560 1600 520 L1600 900 L0 900Z" fill="#C9D8C3" opacity="0.55"/>
    <path d="M0 700 C260 630 420 690 640 650 C860 610 1000 680 1220 640 C1400 610 1500 650 1600 630 L1600 900 L0 900Z" fill="#A9C4B4" opacity="0.65"/>
    <path d="M0 760 C300 710 520 760 760 730 C1000 700 1200 760 1600 720 L1600 900 L0 900Z" fill="#7FAFA8" opacity="0.5"/>
  </g>

  <!-- pond -->
  <g filter="url(#paint)">
    <path d="M0 790 C400 770 900 800 1600 775 L1600 900 L0 900Z" fill="url(#pond)" opacity="0.9"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
    <path d="M820 830 q40 -10 80 0 t80 0"/>
    <path d="M1060 858 q50 -10 100 0 t100 0"/>
    <path d="M1360 820 q40 -10 80 0 t80 0"/>
  </g>

  <!-- lily pads -->
  <g fill="#6E9A83" opacity="0.8">
    <ellipse cx="960" cy="815" rx="70" ry="16"/>
    <ellipse cx="1330" cy="850" rx="85" ry="18"/>
    <ellipse cx="1500" cy="812" rx="60" ry="13"/>
    <ellipse cx="1110" cy="845" rx="55" ry="12" fill="#7FAE97"/>
  </g>

  <!-- lotus flowers -->
  <use href="#lotus" transform="translate(1330 838) scale(1.15)"/>
  <use href="#lotus" transform="translate(960 808) scale(0.8)"/>
  <use href="#lotus" transform="translate(1500 805) scale(0.6)"/>

  <!-- soft leaf accent, top right -->
  <g fill="none" stroke="#C9A24D" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round">
    <path d="M1480 40 C1520 120 1500 200 1450 260"/>
    <path d="M1540 70 C1570 140 1555 210 1520 260"/>
  </g>
  <g fill="#7FAE97" opacity="0.35">
    <path d="M1450 260 C1420 210 1425 160 1470 120 C1490 170 1480 220 1450 260Z"/>
    <path d="M1520 260 C1500 215 1510 170 1555 140 C1568 185 1552 225 1520 260Z"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)"/>
</svg>
